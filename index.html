<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video final ABP · Barrera flotante Puerta de Oro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --acento:#ff0e0e;--acento-oscuro:#cc0b0b;--acento-suave:#ffe7e7;
    --texto:#414141;--texto-suave:#555a61;--texto-tenue:#9aa0a6;
    --borde:#d7dade;--borde-suave:#ecedee;
    --superficie:#ffffff;--superficie-hover:#f4f5f6;--fondo:#fefeff;
    --radio-sm:8px;--radio-lg:16px;
    --sombra-sm:0 2px 6px rgba(20,20,43,.06);
    --sombra-md:0 10px 30px rgba(20,20,43,.12),0 2px 6px rgba(20,20,43,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fondo);color:var(--texto);-webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---------- Header CUC ---------- */
  .hdr{
    position:relative;display:flex;align-items:center;justify-content:space-between;
    height:63px;padding:0 24px;color:#fff;background-color:#c8000d;
    box-shadow:0 2px 8px rgba(120,0,8,.35);
  }
  .hdr-izq{display:flex;align-items:center;gap:22px;position:relative;z-index:1}
  .hdr-logo{height:25px;width:auto;display:block;padding-left:60px}
  .hdr-logo-txt{padding-left:60px;font-weight:800;font-size:.95rem;letter-spacing:.3px;
    text-transform:uppercase;white-space:nowrap}
  .hdr-titulo{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:1.05rem;font-weight:500;letter-spacing:.2px;text-transform:uppercase;
    white-space:nowrap;max-width:calc(100% - 420px);overflow:hidden;text-overflow:ellipsis;
  }
  @media(max-width:820px){.hdr-titulo{display:none}}
  @media(max-width:560px){.hdr{padding:0 14px}.hdr-logo,.hdr-logo-txt{padding-left:0}.hdr-logo{height:22px}}

  /* ---------- Contenido ---------- */
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  .top{margin-bottom:22px;text-align:center}
  .eyebrow{
    display:inline-flex;align-items:center;gap:6px;background:var(--acento-suave);
    color:var(--acento-oscuro);font-size:.72rem;font-weight:800;letter-spacing:.3px;
    text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:12px;
  }
  h1{font-size:1.6rem;font-weight:800;line-height:1.2;margin-bottom:8px;color:#2b2b2b}
  .top p{color:var(--texto-suave);font-size:.92rem;line-height:1.55;max-width:680px;margin:0 auto}

  .card{background:var(--superficie);border:1px solid var(--borde-suave);
    border-radius:var(--radio-lg);box-shadow:var(--sombra-md);padding:14px}
  .marco{position:relative;width:100%;aspect-ratio:16/9;background:#000;
    border-radius:12px;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;object-fit:contain}

  .aviso{display:none;position:absolute;inset:0;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;padding:24px;text-align:center;color:#fff;
    background:rgba(0,0,0,.85);font-size:.9rem;line-height:1.5}
  .aviso.visible{display:flex}
  .aviso a{color:#fff;font-weight:700}

  .barra{display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;padding:14px 4px 2px}
  .vel{display:flex;align-items:center;gap:10px;font-size:.8rem;font-weight:700;color:var(--texto-suave)}
  .segmentos{display:flex;background:var(--superficie);border:1px solid var(--borde-suave);
    border-radius:999px;padding:4px;gap:2px;box-shadow:var(--sombra-sm)}
  .seg{background:transparent;border:none;color:var(--texto-suave);padding:7px 13px;
    border-radius:999px;font-size:.82rem;font-weight:700;cursor:pointer;
    transition:all .18s ease;font-family:inherit}
  .seg:hover{color:var(--texto)}
  .seg.activo{background:var(--acento);color:#fff;box-shadow:var(--sombra-sm)}
  .acciones{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1.5px solid var(--borde);border-radius:var(--radio-sm);padding:9px 14px;
    font-weight:700;font-size:.85rem;cursor:pointer;transition:all .18s ease;
    background:var(--superficie);color:var(--texto);font-family:inherit;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--superficie-hover)}
  .btn-primario{background:var(--acento);border-color:var(--acento);color:#fff}
  .btn-primario:hover{background:var(--acento-oscuro);border-color:var(--acento-oscuro)}
  .seg:focus-visible,.btn:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}

  .pie{margin-top:18px;text-align:center;font-size:.78rem;color:var(--texto-tenue)}
</style>
</head>

<script>
const video=document.getElementById('video');
const aviso=document.getElementById('aviso');

// Mensaje si el video no carga (formato no soportado o sin conexión)
function mostrarError(){aviso.classList.add('visible');}
video.addEventListener('error',mostrarError);
video.querySelector('source').addEventListener('error',mostrarError);

// Velocidad de reproducción
document.getElementById('segVel').addEventListener('click',e=>{
  const b=e.target.closest('.seg');if(!b)return;
  document.querySelectorAll('#segVel .seg').forEach(x=>x.classList.remove('activo'));
  b.classList.add('activo');
  video.playbackRate=+b.dataset.v;
});

// Pantalla completa (con respaldo para iPhone)
document.getElementById('full').addEventListener('click',()=>{
  if(video.requestFullscreen)video.requestFullscreen();
  else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();
});
</script>
